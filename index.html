<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>led editor add mini link</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <ul class="list-menu">
        <li><a href="https://tranchausky.github.io/led7219-matrix-editor/">Home</a></li>
        <li><a href="https://tranchausky.github.io/led7219-matrix-editor/?v=2141FF0101y54y%2C2141FF0101C38589F1y46y%2C2141FF0101C38589F1818989FFy38y%2C2141FF0101C38589F1818989FF1828489Fy30y%2C2141FF0101C38589F1818989FF1828489FF98989CFy22y%2C2141FF0101C38589F1818989FF1828489FF98989CFFF8989CFy14y%2C2141FF0101C38589F1818989FF1828489FF98989CFFF8989CF838488Fy7y%2CFF9191FFy56y%2CFF9191FFF19191FFy48y%2CFF9191FFF19191FF003048442244483y33y">Basic number</a></li>
        <li><a class="community-link" href="comment.html" target="_blank" rel="noopener"><span aria-hidden="true">💬</span> Community · Share designs <span aria-hidden="true">↗</span></a></li>
    </ul>
    <form id="matrix-size">
        <label>Width <input id="matrix-width" type="number" min="1" max="128" value="8" required></label>
        <label>Height <input id="matrix-height" type="number" min="1" max="128" value="8" required></label>
        <button type="submit">Apply size</button>
        <button type="button" id="preset-p10">P10 32×16</button>
        <p>Size per table (1–128 pixels). Resizing keeps the top-left area; pixels outside the new size are cropped, including exported frames.</p>
    </form>
    <button id="share-link">Copy share link</button>
    <button id="add-table">Add Table</button>
    <button id="export-tables">Export Tables</button>
    <button id="playexport">Play export</button>
    <div class="table-zoom" role="group" aria-label="Table zoom">
        <span>Zoom</span>
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-reset" title="Reset zoom to 100%" aria-label="Reset zoom to 100%">100%</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <output id="zoom-level" aria-live="polite">100%</output>
    </div>
    <div id="tables-viewport" tabindex="0" role="region" aria-label="LED tables, scroll horizontally to view more">
        <div id="tables-container"></div>
    </div>
    <div id="export-all">
        <label for="">Hex Col</label><br/>
        <textarea name="" id="export-hex-col" cols="100" rows="3" readonly></textarea>
        <br/>
        <br/>
        <label for="">Mini Hex Col</label><br/>
        <textarea name="" id="export-hex-mini" cols="100" rows="3" readonly></textarea>
    </div>
    <div id="export-container">
        <div id="exported-data" style="white-space: pre-wrap; margin: 20px;"></div> <!-- Container for exported data -->
    </div>

    <div id="toast">Text copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
